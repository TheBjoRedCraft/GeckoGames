services:
  gecko-server:
    build:
      context: ..
      dockerfile: surf-gecko-server/Dockerfile
    ports:
      - "25565:25565"
      - "8080:8080"
    volumes:
      - gecko-data:/server/data
    environment:
      - JVM_OPTS=-Xms512m -Xmx1g
    restart: unless-stopped

volumes:
  gecko-data:
