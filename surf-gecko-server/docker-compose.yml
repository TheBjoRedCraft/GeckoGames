services:
  gecko-server:
    build:
      context: ..
      dockerfile: surf-gecko-server/Dockerfile
    ports:
      - "25565:25565"
    volumes:
      - gecko-data:/server/data
    environment:
      - JVM_OPTS=-Xms512m -Xmx1g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gecko
      POSTGRES_USER: gecko
      POSTGRES_PASSWORD: gecko
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U gecko" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  gecko-data:
  postgres-data:
  redis-data:
